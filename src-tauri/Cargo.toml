[package]
name = "ecom-mobile"
version = "0.1.0"
description = "Biblia — Traducción contextual (escritorio)"
authors = ["you"]
edition = "2024"

[lib]
name = "ecom_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true